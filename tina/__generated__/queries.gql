query flashDesigns($relativePath: String!) {
  flashDesigns(relativePath: $relativePath) {
    ... on Document {
      _sys {
        filename
        basename
        hasReferences
        breadcrumbs
        path
        relativePath
        extension
      }
      id
    }
    ...FlashDesignsParts
  }
}

query flashDesignsConnection($before: String, $after: String, $first: Float, $last: Float, $sort: String, $filter: FlashDesignsFilter) {
  flashDesignsConnection(
    before: $before
    after: $after
    first: $first
    last: $last
    sort: $sort
    filter: $filter
  ) {
    pageInfo {
      hasPreviousPage
      hasNextPage
      startCursor
      endCursor
    }
    totalCount
    edges {
      cursor
      node {
        ... on Document {
          _sys {
            filename
            basename
            hasReferences
            breadcrumbs
            path
            relativePath
            extension
          }
          id
        }
        ...FlashDesignsParts
      }
    }
  }
}

